name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Run tests
        run: |
          make test CC=${{ matrix.compiler }}

      - name: Build example
        run: |
          make example CC=${{ matrix.compiler }}

  avr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up AVR environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-avr avr-libc simavr gdb-avr

      - name: Build and simulate AVR example
        run: |
          make example-avr.elf output/example-avr.md
